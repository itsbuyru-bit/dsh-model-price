name: Feature request
description: Suggest a capability or a UI improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or inconvenient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it behave? Mockups and screenshots are welcome, without secrets.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Price table
        - Composer line / popover
        - Wallet
        - Localization
        - Documentation
        - Other
    validations:
      required: true
