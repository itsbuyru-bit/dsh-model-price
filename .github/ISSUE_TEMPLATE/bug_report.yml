name: Bug report
description: Report a problem with dsh-model-price
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include account tokens, API keys or private session data.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Plugins → dsh-model-price, or the `version` in package.json
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the expected and the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Models & prices
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: The last lines of `node scripts/check.mjs`, browser console errors, or a screenshot.
      render: text
