name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release $TAG." > notes.md
          fi
          printf '\n---\n\nInstall from GitHub with `github:itsbuyru-bit/dsh-model-price`. See the [README](README.md) for configuration and languages.\n' >> notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-model-price ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
