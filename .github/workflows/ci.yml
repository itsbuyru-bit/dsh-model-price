name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest, syntax and locales
        run: node scripts/check.mjs
      - name: Unit tests
        run: npm test
      - name: Lint workflows
        uses: raven-actions/actionlint@v2
        with:
          # The awk program in release.yml is single-quoted on purpose; shellcheck
          # reports a false-positive SC2016 for it, so only actionlint runs.
          shellcheck: false
